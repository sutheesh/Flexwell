name: FlexFit
options:
  bundleIdPrefix: com.ilabbs
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  FlexFitEngine:
    path: Packages/FlexFitEngine

targets:
  FlexFit:
    type: application
    platform: iOS
    sources:
      - path: FlexFit
    dependencies:
      - package: FlexFitEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilabbs.flexfit
        PRODUCT_NAME: FlexFit
        # iPhone AND iPad — must match Info.plist's ~ipad orientations. Decided 2026-09-24.
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FlexFit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: FlexFit/FlexFit.entitlements
    scheme:
      # Local StoreKit testing. Only applies when Xcode launches the app; the file isn't bundled.
      storeKitConfiguration: Config/FlexFit.storekit
      testTargets:
        - package: FlexFitEngine/FlexFitEngineTests
