name: FlexFit
options:
  bundleIdPrefix: com.ilabbs
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  FlexFitEngine:
    path: Packages/FlexFitEngine

targets:
  FlexFit:
    type: application
    platform: iOS
    sources:
      - path: FlexFit
      - path: Shared
    dependencies:
      - package: FlexFitEngine
      - target: FlexFitWidgets
      - target: FlexFitWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilabbs.flexfit
        PRODUCT_NAME: FlexFit
        # iPhone AND iPad — must match Info.plist's ~ipad orientations. Decided 2026-09-24.
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FlexFit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: FlexFit/FlexFit.entitlements
    scheme:
      # Local StoreKit testing. Only applies when Xcode launches the app; the file isn't bundled.
      storeKitConfiguration: Config/FlexFit.storekit
      testTargets:
        - package: FlexFitEngine/FlexFitEngineTests
  FlexFitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FlexFitWidgets
      - path: Shared
      - path: FlexFit/Theme/DesignTokens.swift
      - path: FlexFit/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilabbs.flexfit.widgets
        PRODUCT_NAME: FlexFitWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FlexFitWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: FlexFitWidgets/FlexFitWidgets.entitlements
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
  FlexFitWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"   # Series 5 tops out at watchOS 10
    sources:
      - path: FlexFitWatch
      - path: Shared/WatchPayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilabbs.flexfit.watchkitapp
        PRODUCT_NAME: FlexFit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FlexFit
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.ilabbs.flexfit
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
